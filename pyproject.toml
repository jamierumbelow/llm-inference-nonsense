[project]
name = "llm-inference-nonsense"
version = "0.0.0"
description = "A repo where I learn about LLM inference"
requires-python = ">=3.13"
# Workspace members, so a plain `uv sync` installs all of them editable.
dependencies = [
    "harness",
    "modal>=1.5.5",
    "runner",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff",
    "pyright",
    "marimo",
    "transformers",
]

[tool.uv.workspace]
members = ["packages/*", "experiments/*"]

[tool.uv.sources]
harness = { workspace = true }
runner = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "RUF",      # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# A bare expression at the end of a marimo cell is how the cell displays it.
"notebooks/*" = ["B018"]

[tool.ruff.lint.isort]
known-first-party = ["harness", "bench", "analysis"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
include = ["packages", "experiments", "tools"]
extraPaths = ["packages/harness/src", "packages/runner/src"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["packages", "experiments"]
addopts = "-ra -m 'not slow'"
markers = [
    "slow: needs model weights on disk; run with `-m slow` or `-m ''`",
]
